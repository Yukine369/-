<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ежедневки</title>
<meta name="theme-color" content="#1f3d34">
<meta name="description" content="Ежедневные, еженедельные и ежемесячные задания, цели и награды за выполнение.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4; --paper:#fffaf0; --ink:#1d2622; --muted:#6b7068; --line:#e3dac8;
  --green:#1f3d34; --green-2:#2f5a4c; --gold:#e0a526; --gold-soft:#fbecc4;
  --red:#b9452f; --ok:#2e7d55; --ok-soft:#dcefe2;
  --r:18px; --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -14px rgba(31,61,52,.35);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#f7f1e3;padding:calc(12px + var(--safe-t)) 0 0}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:var(--green);font:700 18px Unbounded,sans-serif;flex:none}
.brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balance{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px 6px 8px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.balance .ic{font-size:18px}
.balance.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);background:rgba(224,165,38,.4)}}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#cfd8cf;padding:10px 14px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--gold)}

main{padding:18px 0 calc(110px + var(--safe-b))}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.section-h h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-2)}
.section-h .hint{color:var(--muted);font-size:13px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* download banner */
.dl{display:flex;gap:14px;align-items:center;padding:14px 16px;background:linear-gradient(120deg,#244a3e,#1f3d34);color:#f6efe0;border:0;margin-bottom:6px}
.dl .robot{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.dl p{margin:2px 0 0;color:#c8d3c9;font-size:13px}
.dl .grow{flex:1;min-width:0}
.dl .x{background:none;border:0;color:#9fb1a5;font-size:20px;padding:4px 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none;color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d00}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#efc9bf;background:#fff}
.btn.sm{padding:7px 10px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(20px + var(--safe-b));z-index:15;border-radius:16px;padding:14px 20px;box-shadow:0 10px 24px -8px rgba(31,61,52,.6);font-size:16px}

/* goal set */
.set{margin-bottom:14px;overflow:hidden}
.set-head{padding:16px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.set-emoji{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;font-size:24px;flex:none}
.set-title{flex:1;min-width:0}
.set-title h3{font-size:17px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#efe8d8;font-weight:600;font-size:12px;color:#5b5446}
.pill.late{background:#f6dcd4;color:var(--red)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.icon-btn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover{background:#efe8d8}
.progress{margin:0 16px;height:10px;border-radius:99px;background:#ece4d2;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--ok));border-radius:99px;transition:width .4s}
.progress.full i{background:linear-gradient(90deg,#d99a1a,var(--gold))}
.prog-label{display:flex;justify-content:space-between;margin:6px 16px 4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.goals{list-style:none;margin:8px 0 0;padding:0}
.goal{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px dashed var(--line)}
.check{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid #b9b19f;background:#fff;display:grid;place-items:center;color:transparent;font-size:16px;font-weight:800;transition:.15s}
.goal.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.goal .g-title{flex:1;min-width:0}
.goal.done .g-title span:first-child{text-decoration:line-through;color:var(--muted)}
.g-reward{display:block;font-size:12.5px;color:#8a6a1c}
.coins{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--green-2);font-size:14px}
.closed .check{pointer-events:none}

.bonus{margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:#faf3e1;border:1px solid #f0e2bd;font-size:14px}
.bonus-row{display:flex;gap:8px;align-items:flex-start}
.bonus-row + .bonus-row{margin-top:6px}
.bonus-row .b-ic{width:20px;flex:none;text-align:center}
.bonus-row.dim{color:var(--muted)}
.set-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px}
.set-foot .btn{flex:1;min-width:140px}
.result{margin:10px 16px 0;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px}
.result.all{background:var(--gold-soft);color:#6b4a00}
.result.partial{background:var(--ok-soft);color:var(--ok)}
.result.none{background:#efe8d8;color:var(--muted)}

details.archive > summary{list-style:none;cursor:pointer;color:var(--green-2);font-weight:700;padding:10px 2px}
details.archive > summary::-webkit-details-marker{display:none}

/* rewards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.shop-item{padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.shop-item .em{font-size:30px}
.shop-item .t{font-weight:700;line-height:1.25;flex:1}
.shop-item .cost{font-weight:700;color:var(--green-2)}
.shop-item .edit{position:absolute;top:8px;right:8px}
.prize{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.prize:first-child{border-top:0}
.prize .em{font-size:22px;width:28px;text-align:center}
.prize .t{flex:1;min-width:0}
.prize .t small{display:block;color:var(--muted);font-size:12.5px}
.prize.used{opacity:.55}
.prize.used .t span{text-decoration:line-through}

/* history */
.log{padding:4px 0}
.log-row{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.log-row:first-child{border-top:0}
.log-row time{color:var(--muted);font-size:12.5px;white-space:nowrap;min-width:84px;font-variant-numeric:tabular-nums}
.log-row .tx{flex:1}
.delta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.p{color:var(--ok)} .delta.m{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px}
.stat b{display:block;font:700 22px Unbounded,sans-serif;color:var(--green)}
.stat span{font-size:12.5px;color:var(--muted)}

/* settings */
.form-card{padding:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > span{font-size:13px;font-weight:700;color:var(--green-2)}
.field small{color:var(--muted);font-size:12.5px}
.inp{width:100%;border:1px solid #d9cfba;background:#fff;border-radius:12px;padding:10px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(47,90,76,.15)}
textarea.inp{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:10px}
.row > *{flex:1}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,28,24,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:640px){.overlay{align-items:center;padding:20px}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media (min-width:640px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-h h3{flex:1;font-size:17px}
.sheet-b{padding:4px 18px 10px;overflow:auto}
.sheet-f{display:flex;gap:10px;padding:12px 18px calc(16px + var(--safe-b));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.goal-edit{display:grid;grid-template-columns:1fr 84px 34px;gap:6px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.goal-edit .rw{grid-column:1/3}
.goal-edit .del{grid-row:1/3;grid-column:3;align-self:center}
.seg{display:flex;background:#ece4d2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:#5b5446}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.box{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;background:#fffdf7}
.box h4{margin:0 0 10px;font-size:14px}
.preview{font-size:13px;background:var(--ok-soft);color:#215c3f;padding:8px 10px;border-radius:10px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px}
.emoji-pick button[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset;background:var(--gold-soft)}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;font-size:14px;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:up .2s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* periodic tasks */
.per{margin-bottom:14px;overflow:hidden}
.per-switch{margin:4px 0 14px;position:sticky;top:calc(98px + var(--safe-t));z-index:10;box-shadow:0 6px 14px -10px rgba(31,61,52,.5)}
.per-switch button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px}
.per-switch small{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.per-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.per-head .set-emoji{width:40px;height:40px;font-size:21px}
.per-head h3{font-size:16px}
.per-head .meta{margin-top:3px}
.task .streak{font-size:12px;color:#b5651d;font-weight:700;white-space:nowrap}
.task .t-edit{margin-left:-4px}
.per-all{margin:4px 16px 14px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:#6b4a00;font-weight:600;font-size:14px;text-align:center}
.tpl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* calendar */
.cal-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.cal-card{padding:14px 14px 12px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font:700 15px Unbounded,sans-serif;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-grid .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.cal-grid button{aspect-ratio:1;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:600;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cl0{background:#efe8d8;color:#9a917e}.cl1{background:#dcefe2;color:#215c3f}.cl2{background:#a9d5b8;color:#15402b}.cl3{background:var(--ok);color:#fff}.cl4{background:var(--gold);color:#2a1d00}
.cal-grid button.future{background:transparent;border-color:var(--line);color:#c4bba8}
.cal-grid button.today{box-shadow:0 0 0 2px var(--ink)}
.cal-grid button[aria-pressed=true]{outline:2px solid var(--green-2);outline-offset:2px}
.legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.day-card{padding:14px 16px;margin-top:12px}
.day-card h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.day-item{display:flex;gap:10px;padding:7px 0;font-size:14px;border-top:1px dashed var(--line)}
.day-item:first-of-type{border-top:0}
.perfect-tag{font:600 12.5px Manrope,sans-serif;color:#8a6a1c;white-space:nowrap}

/* update banner */
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b));z-index:40;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--ink);color:#fff;border-radius:16px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);animation:up .25s}
.upd{flex-wrap:wrap}
.upd .grow{flex:1 1 200px;min-width:0;font-size:14px}
.upd .acts{display:flex;gap:8px;align-items:center;margin-left:auto}
body.has-upd .toast{bottom:calc(190px + var(--safe-b))}
.upd .grow small{display:block;color:#b9c2bc;font-size:12.5px}
.upd .x{background:none;border:0;color:#9aa49e;font-size:20px;padding:2px 6px}
.notes{margin:6px 0 0;padding-left:20px}
.notes li{margin:3px 0}

.muted{color:var(--muted)}
.mt{margin-top:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo">✓</div><h1>Ежедневки</h1></div>
    <div class="balance" id="balance" title="Ваш баланс"><span class="ic" id="balIcon">🪙</span><span id="balVal">0</span></div>
  </div>
  <div class="wrap">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="tasks">Задания</button>
      <button class="tab" role="tab" data-tab="calendar">Календарь</button>
      <button class="tab" role="tab" data-tab="goals">Цели</button>
      <button class="tab" role="tab" data-tab="rewards">Награды</button>
      <button class="tab" role="tab" data-tab="history">История</button>
      <button class="tab" role="tab" data-tab="more">Ещё</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<button class="btn primary fab" id="fab">＋ Новый набор целей</button>
<canvas id="confetti" class="hidden"></canvas>

<script>
/* ===================== Настройки сборки ===================== */
const APK_URL = 'app.apk';           // файл APK рядом с сайтом (его кладёт GitHub Actions)
const IN_APP = /GoalsAndroidApp/.test(navigator.userAgent);
const STORE_KEY = 'goals-rewards-v1';   // ключ не меняем, чтобы сохранились старые данные
const APP_VERSION = '2.2.0';             // при каждом выпуске повышать и здесь, и в version.json
// Где лежит version.json и app.apk. Пусто = рядом с этой страницей.
// Если в APK страница вшита внутрь приложения, впишите сюда адрес сайта, например 'https://имя.github.io/ezhednevki/'
const UPDATE_BASE = IN_APP ? 'https://yukine369.github.io/-/' : '';   // в APK страница вшита внутрь, поэтому версию проверяем на сайте

/* ===================== Состояние ===================== */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();

function seed() {
  const d = new Date(); d.setDate(d.getDate() + 7);
  return {
    v: 1,
    coin: { icon: '🪙', name: 'монет' },
    balance: 0,
    sets: [{
      id: uid(), emoji: '🏃', title: 'Полезная неделя', deadline: d.toISOString().slice(0, 10),
      createdAt: now(), status: 'active', result: null,
      goals: [
        { id: uid(), title: '3 тренировки', coins: 30, reward: '', done: false },
        { id: uid(), title: 'Прочитать 100 страниц', coins: 20, reward: '', done: false },
        { id: uid(), title: 'Лечь спать до 23:30 пять раз', coins: 25, reward: 'Утро без будильника', done: false },
        { id: uid(), title: 'Разобрать рабочий стол', coins: 10, reward: '', done: false },
      ],
      bonusAll: { coins: 100, reward: 'Поход в кино' },
      partial: { mode: 'proportional', percent: 75, coins: 40, reward: '', minPercent: 50 },
    }],
    tasks: [
      { id: uid(), emoji: '💧', title: 'Выпить 6 стаканов воды', period: 'day', coins: 5, reward: '' },
      { id: uid(), emoji: '🚶', title: 'Прогулка 30 минут', period: 'day', coins: 10, reward: '' },
      { id: uid(), emoji: '📚', title: 'Почитать 20 минут', period: 'day', coins: 10, reward: '' },
      { id: uid(), emoji: '🧹', title: 'Уборка дома', period: 'week', coins: 30, reward: '' },
      { id: uid(), emoji: '📞', title: 'Позвонить родным', period: 'week', coins: 20, reward: '' },
      { id: uid(), emoji: '💰', title: 'Отложить деньги', period: 'month', coins: 80, reward: '' },
    ],
    taskStats: { done: 0 },
    days: {},
    perfectBonus: 20,
    shop: [
      { id: uid(), emoji: '🎬', title: 'Вечер кино', cost: 60 },
      { id: uid(), emoji: '🍕', title: 'Любимая пицца', cost: 120 },
      { id: uid(), emoji: '🎮', title: 'Новая игра', cost: 400 },
      { id: uid(), emoji: '😴', title: 'День без дел', cost: 250 },
    ],
    prizes: [],
    log: [],
    ui: { tab: 'tasks', hideDl: false },
  };
}

let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return normalize(s); }
  } catch (e) { storageOk = false; }
  return seed();
}
function normalize(s) {
  const base = seed();
  s.coin = Object.assign({}, base.coin, s.coin || {});
  s.sets = Array.isArray(s.sets) ? s.sets : [];
  s.shop = Array.isArray(s.shop) ? s.shop : [];
  s.prizes = Array.isArray(s.prizes) ? s.prizes : [];

function dateRu(ts) { return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
function timeRu(ts) { const d = new Date(ts); return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
function daysLeft(iso) {

function addLog(text, delta = 0) { S.log.unshift({ at: now(), text, delta }); if (S.log.length > 500) S.log.length = 500; }

/* ===================== Логика наград ===================== */
function progress(set) {
  const total = set.goals.length, done = set.goals.filter(g => g.done).length;
  return { total, done, frac: total ? done / total : 0 };
}
// Что человек получит, если подвести итог прямо сейчас
function computeBonus(set) {
  const { total, done, frac } = progress(set);
  const pct = Math.round(frac * 100);
  if (total && done === total) return { kind: 'all', coins: +set.bonusAll.coins || 0, reward: set.bonusAll.reward || '', pct };
  const p = set.partial;
  if (p.mode === 'threshold' && pct >= p.percent && done > 0)
    return { kind: 'partial', coins: +p.coins || 0, reward: p.reward || '', pct };
  if (p.mode === 'proportional' && pct >= p.minPercent && done > 0)
    return { kind: 'partial', coins: Math.round((+set.bonusAll.coins || 0) * frac), reward: p.reward || '', pct };
  return { kind: 'none', coins: 0, reward: '', pct };
}
function partialText(set) {
  const p = set.partial, full = +set.bonusAll.coins || 0;
  if (p.mode === 'threshold') return `Если выполнено от ${p.percent}% — ${coin(+p.coins || 0)}${p.reward ? ' и «' + esc(p.reward) + '»' : ''}`;
  if (p.mode === 'proportional') return `Если выполнено от ${p.minPercent}% — часть бонуса по доле выполненного (из ${coin(full)})${p.reward ? ' и «' + esc(p.reward) + '»' : ''}`;
  return 'Частичное выполнение — без бонуса';
}

function toggleGoal(setId, goalId) {
  const set = S.sets.find(s => s.id === setId); if (!set || set.status !== 'active') return;
  const g = set.goals.find(x => x.id === goalId); if (!g) return;
  g.done = !g.done;
  if (g.done) {
    g.doneAt = now();
    if (+g.coins) changeBalance(+g.coins, `Выполнено: ${g.title}`); else addLog(`Выполнено: ${g.title}`, 0);
    if (g.reward) addPrize(g.reward, `за «${g.title}»`, g.id, '🎁');
    const p = progress(set);
    if (p.done === p.total) { confetti(); toast('Все цели набора выполнены! Заберите главный приз 🏆'); }
    else toast(`+${coin(+g.coins || 0)}${g.reward ? ' и награда «' + g.reward + '»' : ''}`);
  } else {
    g.doneAt = null;
    if (+g.coins) changeBalance(-(+g.coins), `Отменено: ${g.title}`);
    const i = S.prizes.findIndex(p => p.ref === g.id && !p.used); if (i >= 0) S.prizes.splice(i, 1);
  }
  save(); render();
}

function finalizeSet(set) {
  const b = computeBonus(set);
  set.status = 'closed'; set.closedAt = now(); set.result = b;
  if (b.coins) changeBalance(b.coins, `${b.kind === 'all' ? 'Главный приз' : 'Частичный бонус'}: ${set.title}`);
  else addLog(`Итог подведён: ${set.title} (${b.pct}%)`, 0);
  if (b.reward) addPrize(b.reward, `${b.kind === 'all' ? 'главный приз' : 'бонус'} набора «${set.title}»`, null, b.kind === 'all' ? '🏆' : '🥈');
  if (b.kind === 'all') confetti();
  save(); render();
}

function restartSet(set) {
  const copy = JSON.parse(JSON.stringify(set));
  copy.id = uid(); copy.status = 'active'; copy.result = null; copy.closedAt = null; copy.createdAt = now();
  copy.goals.forEach(g => { g.id = uid(); g.done = false; g.doneAt = null; });
  if (set.deadline && set.createdAt) {
    const span = Math.max(1, Math.round((new Date(set.deadline) - new Date(new Date(set.createdAt).toISOString().slice(0, 10))) / 86400000));
    const d = new Date(); d.setDate(d.getDate() + span); copy.deadline = d.toISOString().slice(0, 10);
  }
  S.sets.unshift(copy); addLog(`Новый круг: ${copy.title}`, 0); save(); render(); toast('Набор запущен заново');
}

/* ===================== Периодические задания ===================== */
const PERIODS = {
  day:   { title: 'Ежедневные',   one: 'Каждый день',   emoji: '☀️', unit: ['день', 'дня', 'дней'] },
  week:  { title: 'Еженедельные', one: 'Каждую неделю', emoji: '📅', unit: ['неделя', 'недели', 'недель'] },
  month: { title: 'Ежемесячные',  one: 'Каждый месяц',  emoji: '🗓️', unit: ['месяц', 'месяца', 'месяцев'] },
};
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function periodStart(period, d = new Date()) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (period === 'week') x.setDate(x.getDate() - ((x.getDay() + 6) % 7));   // неделя с понедельника
  if (period === 'month') x.setDate(1);
  return x;
}
function periodEnd(period, d = new Date()) {
  const x = periodStart(period, d);
  if (period === 'day') x.setDate(x.getDate() + 1);
  if (period === 'week') x.setDate(x.getDate() + 7);
  if (period === 'month') x.setMonth(x.getMonth() + 1);
  return x;
}
const periodKey = (period, d = new Date()) => period[0] + ':' + dayKey(periodStart(period, d));
function prevPeriodKey(period) { const x = periodStart(period); x.setDate(x.getDate() - 1); return periodKey(period, x); }
const taskDone = t => t.doneKey === periodKey(t.period);
const taskStreak = t => (t.doneKey === periodKey(t.period) || t.doneKey === prevPeriodKey(t.period)) ? (t.streak || 0) : 0;
function resetsIn(period) {
  const ms = periodEnd(period) - new Date();
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if (d >= 2) return `обновится через ${d} ${plural(d, 'день', 'дня', 'дней')}`;
  if (h >= 1) return `обновится через ${h} ч`;
  return `обновится через ${Math.max(1, Math.ceil(ms / 60000))} мин`;
}

/* ===================== Календарь: запись по дням ===================== */
function dayRec(key) { return S.days[key] || (S.days[key] = { items: [], total: 0, done: 0, bonus: 0 }); }
// обновить запись сегодняшнего дня; возвращает true, если только что стал идеальным
function syncToday() {
  const daily = S.tasks.filter(t => t.period === 'day');
  const key = dayKey(new Date());
  if (!daily.length && !S.days[key]) return false;
  const r = dayRec(key);
  r.total = daily.length; r.done = daily.filter(taskDone).length;
  if (r.total && r.done === r.total && !r.bonus && !r.perfect) {
    r.perfect = true; r.bonus = S.perfectBonus;
    if (r.bonus) changeBalance(r.bonus, 'Идеальный день'); else addLog('Идеальный день', 0);
    return true;
  }
  return false;
}
function perfectStreak() {
  let n = 0; const d = new Date();
  const today = S.days[dayKey(d)];
  if (!(today && today.perfect)) d.setDate(d.getDate() - 1);   // сегодня ещё не закончился
  for (;;) { const r = S.days[dayKey(d)]; if (r && r.perfect) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function bestStreak() {
  const keys = Object.keys(S.days).filter(k => S.days[k].perfect).sort();
  let best = 0, cur = 0, prev = null;
  for (const k of keys) {
    const d = new Date(k + 'T12:00:00');
    if (prev) { const p = new Date(prev); p.setDate(p.getDate() + 1); cur = dayKey(p) === k ? cur + 1 : 1; } else cur = 1;
    best = Math.max(best, cur); prev = d;
  }
  return best;
}
function dayLevel(r) {
  if (!r || !r.total) return 0;
  if (r.perfect && r.done === r.total) return 4;
  if (r.perfect) return 3;
  const f = r.done / r.total;
  return f === 0 ? 0 : f < 0.34 ? 1 : f < 0.67 ? 2 : 3;
}

function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const cur = periodKey(t.period);
  if (t.doneKey === cur) {
    t.doneKey = t.prevDoneKey || null; t.streak = t.prevStreak || 0;
    if (t.coins) changeBalance(-t.coins, `Отменено задание: ${t.title}`);
    const i = S.prizes.findIndex(p => p.ref === t.id + cur && !p.used); if (i >= 0) S.prizes.splice(i, 1);
    S.taskStats.done = Math.max(0, S.taskStats.done - 1);
    for (const k of Object.keys(S.days)) {   // убрать отметку из календаря
      const r = S.days[k], j = r.items.findIndex(x => x.id === t.id && x.pk === cur);
      if (j >= 0) { r.items.splice(j, 1); break; }
    }
    if (t.period === 'day') {
      const r = S.days[dayKey(new Date())];
      if (r && r.perfect) { r.perfect = false; if (r.bonus) changeBalance(-r.bonus, 'Отменён идеальный день'); r.bonus = 0; }
    }
  } else {
    t.prevDoneKey = t.doneKey || null; t.prevStreak = t.streak || 0;
    t.streak = t.doneKey === prevPeriodKey(t.period) ? (t.streak || 0) + 1 : 1;
    t.doneKey = cur; S.taskStats.done++;
    dayRec(dayKey(new Date())).items.push({ id: t.id, pk: cur, title: t.title, emoji: t.emoji || '', period: t.period, coins: t.coins, at: now() });
    if (t.coins) changeBalance(t.coins, `Задание: ${t.title}`); else addLog(`Задание: ${t.title}`, 0);
    if (t.reward) addPrize(t.reward, `за задание «${t.title}»`, t.id + cur, '🎁');
    const group = S.tasks.filter(x => x.period === t.period);
    if (t.period === 'day' && syncToday()) { confetti(); toast(`Идеальный день! ${S.perfectBonus ? '+' + coin(S.perfectBonus) + ' ' : ''}🌟`); }
    else if (group.length > 1 && group.every(taskDone)) { confetti(90); toast(`Все ${PERIODS[t.period].title.toLowerCase()} выполнены! 🎉`); }
    else toast(`+${coin(t.coins)}${t.streak > 1 ? ' · серия ' + t.streak + ' 🔥' : ''}`);
  }
  save(); render();
}

function viewCalendar() {
  const now_ = new Date(), todayKey = dayKey(now_);
  const [y, m] = (S.ui.calMonth || todayKey.slice(0, 7)).split('-').map(Number);
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const keys = Object.keys(S.days).filter(k => S.days[k].total).sort();
  const startKey = keys[0] || todayKey;
  // процент за месяц: среднее по дням с начала учёта до сегодня; пропущенные дни считаются как 0
  let sum = 0, cnt = 0;
  for (let d = 1; d <= daysIn; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`;
    if (k < startKey || k > todayKey) continue;
    const r = S.days[k]; cnt++; if (r && r.total) sum += Math.min(1, r.done / r.total);
  }
  const monthPct = cnt ? Math.round(sum / cnt * 100) : 0;
  const streak = perfectStreak(), best = bestStreak();
  const sel = S.ui.calDay || todayKey;
  let cells = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < offset; i++) cells += '<div></div>';
  for (let d = 1; d <= daysIn; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`, r = S.days[k], fut = k > todayKey;
    cells += `<button type="button" data-act="cal-day" data-k="${k}" class="${fut ? 'future' : 'cl' + dayLevel(r)}${k === todayKey ? ' today' : ''}" aria-pressed="${k === sel}" ${fut ? 'disabled' : ''} aria-label="${d}">${d}</button>`;
  }
  const monthName = first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
  const isCur = `${y}-${pad(m)}` === todayKey.slice(0, 7);
  // выбранный день
  const r = S.days[sel], selDate = new Date(sel + 'T12:00:00');
  const selTitle = selDate.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  let dayHtml;
  if (!r || (!r.items.length && !r.total)) dayHtml = `<p class="muted" style="margin:8px 0 0;font-size:14px">${sel < startKey ? 'Календарь тогда ещё не вёлся.' : sel === todayKey ? 'Сегодня пока ничего не отмечено.' : 'В этот день ничего не отмечено.'}</p>`;
  else dayHtml = `${r.total ? `<p class="muted" style="margin:4px 0 8px;font-size:13px">Ежедневных выполнено: ${r.done} из ${r.total}</p>` : ''}
    ${r.items.map(x => `<div class="day-item"><span style="color:var(--ok);font-weight:800">✓</span><span style="flex:1">${esc(x.emoji)} ${esc(x.title)}${x.period !== 'day' ? ` <span class="pill">${x.period === 'week' ? 'неделя' : 'месяц'}</span>` : ''}</span><span class="coins">+${coin(x.coins)}</span></div>`).join('')}`;
  return `<div class="cal-stats">
      <div class="card stat"><b>🔥 ${streak}</b><span>${plural(streak, 'идеальный день', 'идеальных дня', 'идеальных дней')} подряд · рекорд ${best}</span></div>
      <div class="card stat"><b>${monthPct}%</b><span>ежедневных выполнено за месяц</span></div>
    </div>
    <div class="card cal-card">
      <div class="cal-nav"><button class="icon-btn" data-act="cal-month" data-d="-1" aria-label="Предыдущий месяц">‹</button><b>${esc(monthName)}</b><button class="icon-btn" data-act="cal-month" data-d="1" aria-label="Следующий месяц" ${isCur ? 'disabled style="opacity:.3"' : ''}>›</button></div>
      <div class="cal-grid">${cells}</div>
      <div class="legend">меньше <i class="cl0"></i><i class="cl1"></i><i class="cl2"></i><i class="cl3"></i> больше · <i class="cl4"></i> идеальный день</div>
    </div>
    <div class="card day-card"><h3><span>${esc(selTitle.charAt(0).toUpperCase() + selTitle.slice(1))}</span>${r && r.perfect ? `<span class="perfect-tag">🌟 идеальный${r.bonus ? ' +' + fmt(r.bonus) : ''}</span>` : ''}</h3>${dayHtml}</div>
    <div class="card form-card mt" style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;font-size:14px"><b>Бонус за идеальный день</b><div class="muted" style="font-size:12.5px">когда выполнены все ежедневные задания</div></div>
      <button class="btn sm" data-act="perfect-bonus">${S.perfectBonus ? '+' + coin(S.perfectBonus) : 'выкл.'} ✎</button>
    </div>`;
}

function setCard(set) {
  const p = progress(set), pct = Math.round(p.frac * 100), closed = set.status === 'closed';
  const dl = daysLeft(set.deadline);
  let due = '';
  if (set.deadline && !closed) due = dl < 0 ? `<span class="pill late">срок вышел</span>` : `<span class="pill">${dl === 0 ? 'сегодня последний день' : 'ещё ' + dl + ' ' + plural(dl, 'день', 'дня', 'дней')}</span>`;
  if (closed) due = `<span class="pill ok">завершён ${dateRu(set.closedAt)}</span>`;
  const earned = set.goals.filter(g => g.done).reduce((a, g) => a + (+g.coins || 0), 0);
  const b = computeBonus(set);
  const goals = set.goals.map(g => `
    <li class="goal ${g.done ? 'done' : ''}" ${closed ? '' : `data-act="toggle" data-set="${set.id}" data-goal="${g.id}" role="checkbox" aria-checked="${g.done}" tabindex="0"`}>
      <span class="check">✓</span>
      <span class="g-title"><span>${esc(g.title)}</span>${g.reward ? `<span class="g-reward">🎁 ${esc(g.reward)}</span>` : ''}</span>
      <span class="coins">+${coin(+g.coins || 0)}</span>
    </li>`).join('');
  let result = '';
  if (closed && set.result) {
    const r = set.result;
    result = `<div class="result ${r.kind}">${r.kind === 'all' ? '🏆 Все цели выполнены! Получено ' : r.kind === 'partial' ? `🥈 Выполнено ${r.pct}% — бонус ` : `Выполнено ${r.pct}% — бонус не положен`}${r.kind !== 'none' ? coin(r.coins) + (r.reward ? ' и «' + esc(r.reward) + '»' : '') : ''}</div>`;
  }
  const allDone = p.total && p.done === p.total;
  const late = set.deadline && dl < 0;
  let foot = '';
  if (!closed) {
    foot = allDone
      ? `<button class="btn gold" data-act="finalize" data-set="${set.id}">🏆 Забрать главный приз</button>`
      : `<button class="btn ${late ? 'primary' : ''}" data-act="finalize" data-set="${set.id}">Подвести итог</button>`;
  } else {
    foot = `<button class="btn" data-act="restart" data-set="${set.id}">↻ Начать заново</button><button class="btn ghost" data-act="delete-set" data-set="${set.id}">Удалить</button>`;
  }
  return `<article class="card set ${closed ? 'closed' : ''}">
    <div class="set-head">
      <div class="set-emoji">${esc(set.emoji || '🎯')}</div>
      <div class="set-title"><h3>${esc(set.title)}</h3>
        <div class="meta">${due}<span>заработано ${coin(earned)}</span></div></div>
      ${closed ? '' : `<button class="icon-btn" data-act="edit-set" data-set="${set.id}" aria-label="Изменить">✎</button>`}
    </div>
    <div class="progress ${allDone ? 'full' : ''}"><i style="width:${pct}%"></i></div>
    <div class="prog-label"><span>${p.done} из ${p.total} ${plural(p.total, 'цели', 'целей', 'целей')}</span><span>${pct}%</span></div>
    <ul class="goals">${goals}</ul>
    ${closed ? result : `<div class="bonus">
      <div class="bonus-row"><span class="b-ic">🏆</span><span><b>Все цели:</b> ${coin(+set.bonusAll.coins || 0)}${set.bonusAll.reward ? ' и «' + esc(set.bonusAll.reward) + '»' : ''}</span></div>
      <div class="bonus-row ${set.partial.mode === 'none' ? 'dim' : ''}"><span class="b-ic">🥈</span><span>${partialText(set)}</span></div>
      ${!allDone && b.kind === 'partial' ? `<div class="bonus-row" style="color:var(--ok)"><span class="b-ic">→</span><span>Сейчас вам положено: <b>${coin(b.coins)}</b>${b.reward ? ' и «' + esc(b.reward) + '»' : ''}</span></div>` : ''}
    </div>`}
    <div class="set-foot">${foot}</div>
  </article>`;
}

/* ===================== Модальные окна ===================== */
function modal({ title, body, okText = 'Готово', cancelText = 'Отмена', danger = false, onOk, onOpen, extra = '' }) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h3>${title}</h3>${extra}<button class="icon-btn" data-x aria-label="Закрыть">✕</button></div>
    <div class="sheet-b">${body}</div>
    <div class="sheet-f">${cancelText ? `<button class="btn" data-x>${cancelText}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${okText}</button></div></div>`;
  const close = () => { o.remove(); window.__back = null; };
  o.addEventListener('click', e => {
    if (e.target === o || e.target.closest('[data-x]')) close();
    else if (e.target.closest('[data-ok]')) { if (!onOk || onOk(o) !== false) close(); }
  });
  document.body.appendChild(o);
  window.__back = () => { close(); return true; };
  onOpen && onOpen(o, close);
  return o;
}
function confirmBox(title, text, okText, onOk, danger) {
  modal({ title, body: `<p style="margin:4px 0 8px">${text}</p>`, okText, danger, onOk });
}

    <div class="box"><h4>🥈 Если выполнены НЕ все цели</h4>
      <div class="seg" id="fMode">
        <button type="button" data-m="proportional">По доле</button><button type="button" data-m="threshold">По порогу</button><button type="button" data-m="none">Ничего</button>
      </div>
      <div class="mt" id="fModeBody"></div>
      <div class="preview mt" id="fPreview"></div>
    </div>`;
  modal({
    title: existing ? 'Изменить набор' : 'Новый набор целей', body, okText: existing ? 'Сохранить' : 'Создать',
    extra: existing ? `<button class="icon-btn" data-delset aria-label="Удалить набор" title="Удалить набор">🗑</button>` : '',
    onOpen(o, close) {
      const P = set.partial;
      const modeBody = () => {
        $('#fMode', o).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
        const mb = $('#fModeBody', o);
        if (mode === 'proportional') mb.innerHTML = `<p class="muted" style="font-size:13.5px;margin:0 0 10px">Получите часть главного приза в ${esc(S.coin.name)} — ровно по доле выполненных целей. Текстовую награду главного приза — только за 100%.</p>
          <div class="row"><label class="field" style="flex:0 0 120px"><span>Минимум, %</span><input class="inp" type="number" min="1" max="99" id="fMin" value="${P.minPercent}"></label>
          <label class="field"><span>Доп. награда (необязательно)</span><input class="inp" id="fPReward" value="${esc(P.reward)}" placeholder="Например: «Кофе с десертом»"></label></div>`;
        else if (mode === 'threshold') mb.innerHTML = `<p class="muted" style="font-size:13.5px;margin:0 0 10px">Фиксированный утешительный приз, если выполнено не меньше указанного процента целей.</p>
          <div class="row"><label class="field"><span>Порог, %</span><input class="inp" type="number" min="1" max="99" id="fPct" value="${P.percent}"></label>
          <label class="field"><span>${esc(S.coin.name)}</span><input class="inp" type="number" min="0" id="fPCoins" value="${+P.coins || 0}"></label></div>
          <label class="field"><span>Награда (необязательно)</span><input class="inp" id="fPReward" value="${esc(P.reward)}" placeholder="Например: «Кофе с десертом»"></label>`;
        else mb.innerHTML = `<p class="muted" style="font-size:13.5px;margin:0">Бонус только за выполнение всех целей. Монеты за отдельные цели всё равно начисляются.</p>`;
        preview();
      };
      const readPartial = () => {
        if ($('#fMin', o)) P.minPercent = clampPct($('#fMin', o).value);
        if ($('#fPct', o)) P.percent = clampPct($('#fPct', o).value);
        if ($('#fPCoins', o)) P.coins = Math.max(0, +$('#fPCoins', o).value || 0);
        if ($('#fPReward', o)) P.reward = $('#fPReward', o).value.trim();
      };
      const preview = () => {
        readPartial();
        const n = Math.max(1, o.querySelectorAll('.goal-edit').length);
        const full = Math.max(0, +$('#fAllCoins', o).value || 0);
        const k = Math.max(1, Math.round(n * 0.7) === n ? n - 1 : Math.round(n * 0.7));
        const pct = Math.round(k / n * 100);
        let txt;
        if (n === 1) txt = 'Добавьте хотя бы две цели, чтобы частичный бонус имел смысл.';
        else if (mode === 'proportional') txt = pct >= P.minPercent ? `Пример: выполнено ${k} из ${n} (${pct}%) → +${coin(Math.round(full * k / n))}` : `Пример: ${k} из ${n} (${pct}%) — меньше минимума ${P.minPercent}%, бонуса не будет`;
        else if (mode === 'threshold') txt = pct >= P.percent ? `Пример: выполнено ${k} из ${n} (${pct}%) → +${coin(P.coins)}${P.reward ? ' и «' + P.reward + '»' : ''}` : `Пример: ${k} из ${n} (${pct}%) — ниже порога ${P.percent}%, бонуса не будет`;
        else txt = `Пример: выполнено ${k} из ${n} — бонуса нет, только ${esc(S.coin.name)} за сами цели`;
        $('#fPreview', o).textContent = txt;
      };
      $('#fMode', o).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; readPartial(); mode = b.dataset.m; modeBody(); });
      o.addEventListener('input', preview);
      $('#fEmoji', o).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; emoji = b.textContent; $('#fEmoji', o).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      $('#fAddGoal', o).addEventListener('click', () => { $('#fGoals', o).insertAdjacentHTML('beforeend', goalRow({ coins: 10 })); const l = o.querySelectorAll('.g-t'); l[l.length - 1].focus(); preview(); });
      $('#fGoals', o).addEventListener('click', e => { if (e.target.closest('[data-del]')) { e.target.closest('.goal-edit').remove(); preview(); } });
      const del = o.querySelector('[data-delset]');
      if (del) del.addEventListener('click', () => { close(); confirmBox('Удалить набор?', `«${esc(existing.title)}» исчезнет. ${esc(S.coin.name)}, которые уже получены, останутся.`, 'Удалить', () => { S.sets = S.sets.filter(s => s.id !== existing.id); addLog(`Удалён набор: ${existing.title}`); save(); render(); }, true); });
      modeBody();
      if (!existing) setTimeout(() => $('#fTitle', o).focus(), 50);
    },
    onOk(o) {
      const title = $('#fTitle', o).value.trim();
      const rows = [...o.querySelectorAll('.goal-edit')].map(r => ({ id: r.dataset.gid, title: $('.g-t', r).value.trim(), coins: Math.max(0, Math.round(+$('.g-c', r).value || 0)), reward: $('.g-r', r).value.trim() })).filter(r => r.title);
      if (!title) { toast('Введите название набора'); $('#fTitle', o).focus(); return false; }
      if (!rows.length) { toast('Добавьте хотя бы одну цель'); return false; }
      const P = set.partial;
      if ($('#fMin', o)) P.minPercent = clampPct($('#fMin', o).value);
      if ($('#fPct', o)) P.percent = clampPct($('#fPct', o).value);
      if ($('#fPCoins', o)) P.coins = Math.max(0, +$('#fPCoins', o).value || 0);
      if ($('#fPReward', o)) P.reward = $('#fPReward', o).value.trim();
      P.mode = mode;
      const old = existing ? existing.goals : [];
      const goals = rows.map(r => {
        const prev = old.find(g => g.id && g.id === r.id);
        return { id: prev ? prev.id : uid(), title: r.title, coins: r.coins, reward: r.reward, done: prev ? prev.done : false, doneAt: prev ? prev.doneAt : null };
      });
      // пересчёт баланса, если изменились монеты у уже выполненных целей
      const oldSum = old.filter(g => g.done).reduce((a, g) => a + (+g.coins || 0), 0);
      const newSum = goals.filter(g => g.done).reduce((a, g) => a + (+g.coins || 0), 0);
      const next = Object.assign(set, { title, emoji, deadline: $('#fDeadline', o).value || '', goals,
        bonusAll: { coins: Math.max(0, Math.round(+$('#fAllCoins', o).value || 0)), reward: $('#fAllReward', o).value.trim() } });
      if (existing) {
        Object.assign(existing, next);
        if (newSum !== oldSum) changeBalance(newSum - oldSum, `Пересчёт после изменения: ${title}`);
        else addLog(`Изменён набор: ${title}`);
      } else { S.sets.unshift(next); addLog(`Новый набор: ${title}`); }
      save(); render(); toast(existing ? 'Сохранено' : 'Набор создан — вперёд!');
    },
  });
}
function clampPct(v) { return Math.min(99, Math.max(1, Math.round(+v || 0))); }

function finalizeDialog(set) {
  const b = computeBonus(set), p = progress(set);
  let text;
  if (b.kind === 'all') text = `Все ${p.total} ${plural(p.total, 'цель', 'цели', 'целей')} выполнены! Вы получите <b>${coin(b.coins)}</b>${b.reward ? ' и награду «' + esc(b.reward) + '»' : ''}.`;
  else if (b.kind === 'partial') text = `Выполнено ${p.done} из ${p.total} (${b.pct}%). Частичный бонус: <b>${coin(b.coins)}</b>${b.reward ? ' и «' + esc(b.reward) + '»' : ''}.<br><span class="muted">Набор закроется, отмечать цели больше будет нельзя.</span>`;
  else text = `Выполнено ${p.done} из ${p.total} (${b.pct}%). По правилам этого набора бонус не положен — ${esc(S.coin.name)} за выполненные цели останутся у вас.<br><span class="muted">Набор закроется. Можно будет начать его заново.</span>`;
  confirmBox(b.kind === 'all' ? 'Главный приз 🏆' : 'Подвести итог?', text, b.kind === 'all' ? 'Забрать!' : 'Закрыть набор', () => finalizeSet(set));
}

}

/* ===================== Резервные копии ===================== */
function exportJson() { return JSON.stringify(Object.assign({}, S, { exportedAt: new Date().toISOString() })); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e2) { return false; }
  }
}
function importJson(text) {
  let s; try { s = JSON.parse(text); } catch (e) { toast('Не получилось прочитать копию'); return; }
  if (!s || s.v !== 1 || !Array.isArray(s.sets)) { toast('Это не резервная копия «Ежедневок»'); return; }
  confirmBox('Восстановить копию?', 'Текущие данные на этом устройстве заменятся данными из копии.', 'Восстановить', () => {
    delete s.exportedAt; S = normalize(s); save(); S.ui.tab = 'tasks'; render(); toast('Данные восстановлены');
  });
}

  switch (act) {

      const d = new Date(y, m - 1 + (+el.dataset.d), 1); S.ui.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); break;
    }

      break;

    case 'check-update': checkUpdate(true); break;
    case 'toggle': toggleGoal(el.dataset.set, el.dataset.goal); break;
    case 'new-set': editSet(null); break;
    case 'edit-set': editSet(el.dataset.set); break;
    case 'finalize': set && finalizeDialog(set); break;

    case 'delete-set': set && confirmBox('Удалить набор?', `«${esc(set.title)}» будет удалён из архива.`, 'Удалить', () => { S.sets = S.sets.filter(s => s !== set); save(); render(); }, true); break;
    case 'hide-dl': S.ui.hideDl = true; save(); render(); toast('Скачать приложение можно во вкладке «Ещё»'); break;
    case 'apk': {
      e.preventDefault();
      let ok = false;

      else modal({ title: 'APK ещё не собран', cancelText: '', okText: 'Понятно', body: `<p>На этом сайте пока нет файла приложения. Он появляется автоматически после сборки на GitHub (см. README в проекте).</p><p class="muted">Пока можно пользоваться сайтом — на Android его также можно добавить на главный экран через меню браузера → «Добавить на гл. экран».</p>` });
      break;
    }
    case 'edit-shop': editShop(el.dataset.id); break;
    case 'buy': {
      const it = S.shop.find(x => x.id === el.dataset.id); if (!it) break;
      confirmBox(`${esc(it.emoji)} ${esc(it.title)}`, `Потратить <b>${coin(it.cost)}</b>? Останется ${coin(S.balance - it.cost)}.`, 'Получить', () => {
        if (S.balance < it.cost) return toast('Не хватает');
        changeBalance(-it.cost, `Куплено: ${it.title}`); addPrize(it.title, 'из магазина', null, it.emoji); confetti(40); save(); render(); toast('Заслуженно! Награда в списке «Мои награды»');
      });
      break;
    }
    case 'use-prize': { const p = S.prizes.find(x => x.id === el.dataset.id); if (p) { p.used = true; p.usedAt = now(); addLog(`Использована награда: ${p.title}`); save(); render(); toast('Приятного отдыха!'); } break; }
    case 'save-coin': {
      S.coin.icon = $('#coinIcon').value.trim() || '🪙'; S.coin.name = $('#coinName').value.trim() || 'монет'; save(); render(); toast('Сохранено'); break;
    }
    case 'adjust':
      modal({ title: 'Изменить баланс', okText: 'Применить', body: `<label class="field"><span>Сколько добавить (минус — списать)</span><input class="inp" type="number" id="adjV" value="0"></label><label class="field"><span>Причина</span><input class="inp" id="adjT" placeholder="Например: подарок за старание"></label>`,
        onOk(o) { const v = Math.round(+$('#adjV', o).value || 0); if (!v) return; changeBalance(v, 'Вручную: ' + ($('#adjT', o).value.trim() || 'корректировка')); save(); render(); } });
      break;
    case 'export-copy': toast(await copyText(exportJson()) ? 'Скопировано — вставьте на другом устройстве' : 'Не удалось скопировать'); break;
    case 'export-file': {
      const name = 'ezhednevki-' + new Date().toISOString().slice(0, 10) + '.json';
      if (IN_APP && window.AndroidBridge) { window.AndroidBridge.shareFile(name, exportJson()); break; }
      try {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportJson()], { type: 'application/json' })); a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      } catch (_) { toast('Скачивание недоступно — используйте «Скопировать данные»'); }
      break;
    }
    case 'import': {
      const f = $('#importFile').files[0];
      if (f) { const r = new FileReader(); r.onload = () => importJson(r.result); r.readAsText(f); }
      else if ($('#importText').value.trim()) importJson($('#importText').value.trim());
      else toast('Вставьте копию или выберите файл');
      break;
    }
    case 'reset': confirmBox('Удалить всё?', 'Все наборы, награды, баланс и история будут удалены без возможности восстановления.', 'Удалить всё', () => { S = seed(); S.sets = []; S.tasks = []; S.ui.hideDl = true; save(); render(); toast('Данные удалены'); }, true); break;
  }
});

/* ===================== Конфетти ===================== */
function confetti(n = 140) {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.classList.remove('hidden');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#e0a526', '#2e7d55', '#b9452f', '#2f5a4c', '#f3d27a', '#7fb685'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[n * Math.random() % cols.length | 0] }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++t < 160) requestAnimationFrame(frame); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); c.classList.add('hidden'); }
  })();
}

/* ===================== Обновления ===================== */
function newer(a, b) {   // a > b ?
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return false;
}
let updShown = false;
async function checkUpdate(manual) {
  let info = null;
  try {
    const r = await fetch(UPDATE_BASE + 'version.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) info = await r.json();
  } catch (_) { }
  if (!info || !info.version) { if (manual) toast('Не удалось проверить — нет интернета?'); return; }
  if (!newer(info.version, APP_VERSION)) { if (manual) toast(`У вас последняя версия (${APP_VERSION})`); return; }
  if (!manual && S.ui.skipVer === info.version) return;
  showUpdate(info);
}
function showUpdate(info) {
  if (updShown) return; updShown = true;
  if (IN_APP) {   // в приложении — всплывающее окно
    const notes = Array.isArray(info.notes) && info.notes.length ? `<p style="margin:4px 0 0"><b>Что нового:</b></p><ul class="notes">${info.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
    const o = modal({ title: '🎉 Вышла новая версия', okText: 'Обновить', cancelText: 'Позже',
      body: `<p style="margin:4px 0 8px">Доступна версия <b>${esc(info.version)}</b>, у вас ${APP_VERSION}.</p>${notes}<p class="muted" style="font-size:13px;margin-top:10px">Скачается новый файл приложения — откройте его и нажмите «Обновить». Ваши задания и монеты сохранятся.</p>`,
      onOk() { updShown = false; doUpdate(info); } });
    o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-x]')) { S.ui.skipVer = info.version; save(); updShown = false; } });
    return;
  }
  const b = document.createElement('div'); b.className = 'upd'; b.setAttribute('role', 'status');
  b.innerHTML = `<div class="grow"><b>Доступна новая версия ${esc(info.version)}</b><small>${IN_APP ? 'Обновите приложение, чтобы получить новые функции' : 'Обновите страницу, чтобы получить новые функции'}</small></div>
    <div class="acts">${Array.isArray(info.notes) && info.notes.length ? '<button class="btn sm" data-u="notes" style="background:transparent;color:#fff;border-color:#4a544f">Что нового</button>' : ''}
    <button class="btn gold sm" data-u="go">Обновить</button><button class="x" data-u="x" aria-label="Позже">×</button></div>`;
  b.addEventListener('click', e => {
    const u = e.target.closest('[data-u]'); if (!u) return;
    if (u.dataset.u === 'x') { S.ui.skipVer = info.version; save(); b.remove(); updShown = false; document.body.classList.remove('has-upd'); toast('Обновиться можно во вкладке «Ещё»'); }
    if (u.dataset.u === 'notes') modal({ title: `Что нового в ${esc(info.version)}`, cancelText: 'Позже', okText: 'Обновить', body: `<ul class="notes">${info.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`, onOk() { doUpdate(info); } });
    if (u.dataset.u === 'go') doUpdate(info);
  });
  document.body.appendChild(b); document.body.classList.add('has-upd');
}
function doUpdate(info) {
  if (IN_APP) {
    const url = new URL(info.apk || APK_URL, new URL(UPDATE_BASE || './', location.href)).href;
    if (window.AndroidBridge && window.AndroidBridge.openUrl) window.AndroidBridge.openUrl(url); else location.href = url;
    toast('Скачивается новая версия — откройте файл, чтобы установить');
  } else {
    toast('Обновляю…');
    const go = () => location.reload();
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(r => r ? r.update().catch(() => { }).finally(go) : go()).catch(go);
    } else go();
  }
}

/* Задания обновляются сами в полночь / понедельник / 1‑е число */
let lastDay = dayKey(new Date());
function tick() {
  const k = dayKey(new Date());
  if (k !== lastDay) { lastDay = k; if (!document.querySelector('.overlay')) render(); }
}
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); checkUpdate(false); } });

save(); render();
setTimeout(() => checkUpdate(false), 1500);
</script>
