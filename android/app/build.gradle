plugins {
    id 'com.android.application'
}

def ks = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.goals.rewards'
    compileSdk 34

    defaultConfig {
        applicationId "com.goals.rewards"
        minSdk 21
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "2.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Без своего ключа APK подписывается отладочным — установить можно, но обновления поверх будут конфликтовать
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
