name: Собрать APK и опубликовать сайт

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Скопировать сайт внутрь приложения
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/index.html web/icons android/app/src/main/assets/www/

      - name: Подготовить ключ подписи (если задан в Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # убираем пробелы и переносы строк, которые часто попадают при копировании
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
            echo "Длина строки ключа: $(wc -c < "$RUNNER_TEMP/ks.b64") символов"
            if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/release.jks"; then
              echo "::error::Секрет KEYSTORE_BASE64 повреждён — скопируйте строку из СЕКРЕТЫ_ДЛЯ_GITHUB.txt заново, целиком"
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан отладочным ключом"
          fi

      - name: Собрать APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Положить APK на сайт
        run: cp android/app/build/outputs/apk/release/app-release.apk web/app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: web/app.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
